<!doctype html>
<!-- The social preview image (public/og.png). Render with og/render.sh.
     No URL in the image: X overlays the domain on its bottom-left corner and LinkedIn prints it below. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #000;
        color: #fff;
        font-family: 'Geist', sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(520px 380px at 16% 108%, rgba(63, 185, 80, 0.2), transparent 70%),
          radial-gradient(560px 420px at 92% 104%, rgba(163, 113, 247, 0.24), transparent 70%);
      }
      .brand {
        position: absolute;
        left: 72px;
        top: 60px;
        display: flex;
        align-items: center;
        gap: 18px;
        font-size: 40px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .brand img {
        width: 84px;
        height: 84px;
      }
      h1 {
        position: absolute;
        left: 72px;
        top: 232px;
        font-size: 60px;
        font-weight: 600;
        line-height: 1.02;
        letter-spacing: -0.045em;
      }
      .sub {
        position: absolute;
        left: 72px;
        top: 390px;
        font-size: 26px;
        color: #a1a1a8;
        letter-spacing: -0.01em;
      }
      /* The real island, hanging from the top edge like the notch: large enough to read, with
         the notch's curved ears and an edge that shows against the black. */
      .notch {
        position: absolute;
        top: 0;
        right: 44px;
        width: 548px;
      }
      .notch::before {
        content: '';
        position: absolute;
        inset: -120px -160px auto;
        height: 420px;
        background: radial-gradient(closest-side, rgba(255, 255, 255, 0.07), transparent);
      }
      .island {
        position: relative;
        border-radius: 0 0 34px 34px;
        overflow: hidden;
        box-shadow:
          0 0 0 1.5px rgba(255, 255, 255, 0.16),
          0 40px 90px rgba(0, 0, 0, 0.7);
      }
      .island img {
        display: block;
        width: 100%;
      }
      .ear {
        position: absolute;
        top: 0;
        width: 18px;
        height: 18px;
      }
      .ear--l {
        left: -18px;
        background: radial-gradient(circle at 0 100%, transparent 17.5px, #000 18px);
      }
      .ear--r {
        right: -18px;
        background: radial-gradient(circle at 100% 100%, transparent 17.5px, #000 18px);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="brand"><img src="../public/logo.png" alt="" />GitIsle</div>
    <h1>Your pull requests,<br />in the notch.</h1>
    <p class="sub">Free and open source for macOS.</p>
    <div class="notch">
      <span class="ear ear--l"></span>
      <span class="ear ear--r"></span>
      <div class="island"><img src="../src/assets/island/list.png" alt="" /></div>
    </div>
  </body>
</html>
