<!doctype html>
<!-- The disk image window's background (scripts/dmg/background.png and @2x). Render with
     scripts/dmg/render-background.sh. Icons sit at (170, 205) and (490, 205); see settings.py. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('../../site/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 660px;
        height: 420px;
        overflow: hidden;
        font-family: 'Geist', -apple-system, sans-serif;
        color: #1d1d1f;
        -webkit-font-smoothing: antialiased;
      }
      body {
        background:
          radial-gradient(260px 200px at 18% 100%, rgba(63, 185, 80, 0.1), transparent 70%),
          radial-gradient(280px 220px at 86% 100%, rgba(163, 113, 247, 0.12), transparent 70%),
          linear-gradient(180deg, #ffffff 0%, #f4f4f6 100%);
      }
      .title {
        position: absolute;
        top: 46px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 19px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .title span {
        color: #86868b;
        font-weight: 500;
      }
      /* From the app icon's right edge to the Applications icon's left edge, at icon height. */
      .arrow {
        position: absolute;
        left: 246px;
        top: 181px;
        width: 168px;
        height: 48px;
      }
      .note {
        position: absolute;
        left: 60px;
        right: 60px;
        bottom: 34px;
        padding: 12px 16px;
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.035);
        font-size: 11.5px;
        line-height: 1.45;
        color: #6e6e73;
        text-align: center;
      }
      .note b {
        color: #1d1d1f;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <p class="title">Drag GitIsle to Applications <span>· then open it from there</span></p>
    <svg class="arrow" viewBox="0 0 168 48" fill="none" stroke="#1d1d1f" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 30 C 50 6, 112 6, 156 26" stroke-dasharray="2 8" />
      <path d="M144 14 L 158 27 L 140 31" />
    </svg>
    <p class="note">
      GitIsle is free and not notarized by Apple. If macOS won't open it the first time, go to
      <b>System Settings → Privacy &amp; Security</b> and click <b>Open Anyway</b>.
    </p>
  </body>
</html>
