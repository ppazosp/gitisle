name: Release

# Push a version tag to publish a release, for example:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: python3 scripts/monitored.py tests swift test --jobs 2
      - name: Package
        # The optimized build can stay silent for many minutes while it optimizes.
        run: >-
          python3 scripts/monitored.py --stale-seconds 1200 --max-seconds 2700
          package bash scripts/package-release.sh "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/GitIsle.zip dist/GitIsle.dmg dist/checksums.txt \
            --title "GitIsle ${GITHUB_REF_NAME#v}" --generate-notes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-logs
          path: .artifacts/
          # The logs live in a dot-folder, which upload-artifact skips unless asked.
          include-hidden-files: true
