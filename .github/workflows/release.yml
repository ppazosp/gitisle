name: Release

# Builds the app and attaches it to a release. Release Please calls this when its release PR
# merges; pushing a version tag by hand still works too:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      TAG: ${{ inputs.tag || github.ref_name }}
    # Plain steps with GitHub's own time limits; their output streams into the run log.
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Test
        timeout-minutes: 20
        run: swift test --jobs 2
      - name: Package
        # The optimized build stays quiet for minutes; on the runner it takes about 10.
        timeout-minutes: 30
        run: bash scripts/package-release.sh "$TAG"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # Release Please has already created the release with its changelog; a hand-pushed
        # tag has none yet. Checksums go last: installed copies offer an update only once
        # both the app and its checksums are attached.
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "GitIsle ${TAG#v}" --generate-notes
          fi
          gh release upload "$TAG" dist/GitIsle.zip dist/GitIsle.dmg --clobber
          gh release upload "$TAG" dist/checksums.txt --clobber
