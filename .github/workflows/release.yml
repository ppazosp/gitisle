name: Release

# Push a version tag to publish a release, for example:
#   git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    # Plain steps with GitHub's own time limits; their output streams into the run log.
    steps:
      - uses: actions/checkout@v5
      - name: Test
        timeout-minutes: 20
        run: swift test --jobs 2
      - name: Package
        # The optimized build stays quiet for minutes; on the runner it takes about 10.
        timeout-minutes: 30
        run: bash scripts/package-release.sh "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/GitIsle.zip dist/GitIsle.dmg dist/checksums.txt \
            --title "GitIsle ${GITHUB_REF_NAME#v}" --generate-notes
