name: Release Please

# Keeps a release PR open that collects every fix: and feat: merged to main. Merging it tags
# the release; the package job then builds and attaches the app.
on:
  push:
    branches: [main]

# Each job gets only the access it needs.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        # Pinned to a commit: this third-party action can write to the repository.
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1

  package:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    secrets:
      GITISLE_SIGNING_KEY: ${{ secrets.GITISLE_SIGNING_KEY }}
