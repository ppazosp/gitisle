name: Site

# Runs only when the site changes; app changes never build or deploy it.
# Pull requests: build check only (no Vercel deployment). main: production deploy.
#
# Deploys with a project-scoped token from the personal Vercel account instead of Vercel's
# Git integration (the GitHub account is linked to a different Vercel account). The site is
# built here and uploaded prebuilt, so the token only needs access to this project.
on:
  pull_request:
    paths: ["site/**", "scripts/install.sh", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["site/**", "scripts/install.sh", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # No secrets here: npm dependencies run during install and build.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
          retention-days: 1

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: site-production
      cancel-in-progress: false
    environment:
      name: Production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      # The CLI checks that the Root Directory (`site`) exists, as in a normal checkout.
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      # Vercel's Build Output format at the repository root (the project's Root Directory is
      # `site`, and the CLI resolves it from here). Writing project.json ourselves skips
      # `vercel pull`, which needs account-level token access.
      - name: Package for Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel/output
          cp -R dist .vercel/output/static
          echo '{"version":3}' > .vercel/output/config.json
          printf '{"projectId":"%s","orgId":"%s"}' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > .vercel/project.json

      - name: Install Vercel CLI
        run: npm install --global vercel@59.11.7

      # The token is visible to this step only.
      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
