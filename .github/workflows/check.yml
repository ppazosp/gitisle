name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - name: Format
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Test
        run: python3 scripts/monitored.py tests swift test --jobs 2
      - name: Build native app
        run: python3 scripts/monitored.py package bash scripts/build-app.sh
      - name: Render native previews
        run: |
          python3 scripts/monitored.py github-preview dist/GitIsle.app/Contents/MacOS/GitIsle --snapshot .artifacts/github.png
          python3 scripts/monitored.py agents-preview dist/GitIsle.app/Contents/MacOS/GitIsle --snapshot .artifacts/agents.png --agents
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: .artifacts/
